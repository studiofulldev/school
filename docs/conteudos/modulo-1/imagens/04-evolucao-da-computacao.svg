<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc"><title id="title">Mudanças na história da computação</title><desc id="desc">Cada etapa destaca uma possibilidade. Tecnologias de épocas diferentes coexistem. 1 REPRESENTAR E CALCULAR: Registros e instrumentos, Máquinas mecânicas, Pascalina: século XVII. 2 PROGRAMAR MÁQUINAS: Instruções para outras tarefas, Projetos de Babbage, Notas de Ada: 1843. 3 CALCULAR ELETRONICAMENTE: Circuitos com válvulas, Programa armazenado, ENIAC apresentado: 1946. 4 MINIATURIZAR CIRCUITOS: Transistor: 1947, Circuitos integrados, Equipamentos menores. 5 INTEGRAR PROCESSAMENTO: Microprocessadores, Funções reunidas em chips, Intel 4004: 1971. 6 AMPLIAR O ACESSO: Computadores pessoais, Casas e escritórios, Expansão nos anos 1970 e 1980</desc><defs><marker id="arrow" markerWidth="12" markerHeight="12" refX="9" refY="6" orient="auto"><path d="M0 0 L12 6 L0 12 Z" fill="#266080"/></marker></defs><rect width="100%" height="100%" fill="#ffffff"/>
