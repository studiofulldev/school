<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="660" viewBox="0 0 1600 660" role="img" aria-labelledby="title desc"><title id="title">Como uma compra vira informação</title><desc id="desc">O mesmo problema pode ser descrito por dados, operações e resultados. ENTRADA: 2 cadernos × R$ 12,00, 1 caneta × R$ 4,00. PROCESSAMENTO: Multiplicar e somar, 2 × 12 + 4. SAÍDA: Total da compra, R$ 28,00. ARMAZENAMENTO: Guardar o registro, Consultar depois</desc><defs><marker id="arrow" markerWidth="12" markerHeight="12" refX="9" refY="6" orient="auto"><path d="M0 0 L12 6 L0 12 Z" fill="#266080"/></marker></defs><rect width="100%" height="100%" fill="#ffffff"/>
<g font-family="Segoe UI,Arial,sans-serif" fill="#162a3a"><text x="60" y="70" font-size="44" font-weight="700">Como uma compra vira informação</text><text x="60" y="117" font-size="26">O mesmo problema pode ser descrito por dados, operações e resultados.</text>
<line x1="395" y1="312" x2="435" y2="312" stroke="#266080" stroke-width="4" marker-end="url(#arrow)"/>
<line x1="780" y1="312" x2="820" y2="312" stroke="#266080" stroke-width="4" marker-end="url(#arrow)"/>
<line x1="1165" y1="312" x2="1205" y2="312" stroke="#266080" stroke-width="4" marker-end="url(#arrow)"/>
<rect x="60" y="190" width="330" height="245" rx="10" fill="#eaf2fa" stroke="#b6ccda" stroke-width="2"/>
<text x="80" y="235" font-size="25" font-weight="700">ENTRADA</text>
<text x="80" y="278" font-size="28">2 cadernos × R$ 12,00</text>
<text x="80" y="320" font-size="28">1 caneta × R$ 4,00</text>
<rect x="445" y="190" width="330" height="245" rx="10" fill="#eaf2fa" stroke="#b6ccda" stroke-width="2"/>
<text x="465" y="235" font-size="25" font-weight="700">PROCESSAMENTO</text>
<text x="465" y="278" font-size="28">Multiplicar e somar</text>
<text x="465" y="320" font-size="28">2 × 12 + 4</text>
<rect x="830" y="190" width="330" height="245" rx="10" fill="#eaf2fa" stroke="#b6ccda" stroke-width="2"/>
<text x="850" y="235" font-size="25" font-weight="700">SAÍDA</text>
<text x="850" y="278" font-size="28">Total da compra</text>
<text x="850" y="320" font-size="28">R$ 28,00</text>
<rect x="1215" y="190" width="325" height="245" rx="10" fill="#eaf2fa" stroke="#b6ccda" stroke-width="2"/>
<text x="1235" y="235" font-size="25" font-weight="700">ARMAZENAMENTO</text>
<text x="1235" y="278" font-size="28">Guardar o registro</text>
<text x="1235" y="320" font-size="28">Consultar depois</text>
<text x="60" y="578" font-size="25">Sequência didática. Sistemas reais podem consultar e armazenar dados em diferentes etapas.</text>
</g></svg>