<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="720" viewBox="0 0 1600 720" role="img" aria-labelledby="title desc"><title id="title">Trabalhos que se conectam</title><desc id="desc">Focos frequentes. As áreas se sobrepõem e os nomes variam entre organizações. CIÊNCIA DA COMPUTAÇÃO: Investigar métodos, Estudar algoritmos, Exemplo: comparar maneiras, de ordenar inscrições. DESENVOLVIMENTO: Construir a aplicação, Testar e manter programas, Exemplo: implementar, o formulário da oficina. TECNOLOGIA DA INFORMAÇÃO: Sustentar os serviços, Administrar acesso e recursos, Exemplo: garantir conexão, e cópias de segurança</desc><defs><marker id="arrow" markerWidth="12" markerHeight="12" refX="9" refY="6" orient="auto"><path d="M0 0 L12 6 L0 12 Z" fill="#266080"/></marker></defs><rect width="100%" height="100%" fill="#ffffff"/>
