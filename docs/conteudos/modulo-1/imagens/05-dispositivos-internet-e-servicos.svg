<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="720" viewBox="0 0 1600 720" role="img" aria-labelledby="title desc"><title id="title">Dispositivos redes e serviços</title><desc id="desc">Uma aplicação pode combinar processamento local e recursos remotos. DISPOSITIVOS: Smartphone ou computador, Programas e sensores, Processamento local. INTERNET: Interconexão de redes, Protocolos de comunicação, Transporte de dados. SERVIDORES FÍSICOS: Dados e serviços remotos, Documentos e mapas, Recursos em nuvem</desc><defs><marker id="arrow" markerWidth="12" markerHeight="12" refX="9" refY="6" orient="auto"><path d="M0 0 L12 6 L0 12 Z" fill="#266080"/></marker></defs><rect width="100%" height="100%" fill="#ffffff"/>
<g font-family="Segoe UI,Arial,sans-serif" fill="#162a3a"><text x="60" y="70" font-size="44" font-weight="700">Dispositivos redes e serviços</text><text x="60" y="117" font-size="26">Uma aplicação pode combinar processamento local e recursos remotos.</text>
<line x1="480" y1="315" x2="580" y2="315" stroke="#266080" stroke-width="4" marker-end="url(#arrow)"/>
<line x1="580" y1="360" x2="480" y2="360" stroke="#266080" stroke-width="4" marker-end="url(#arrow)"/>
