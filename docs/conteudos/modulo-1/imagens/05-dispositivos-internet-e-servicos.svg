<rect x="60" y="195" width="410" height="270" rx="10" fill="#eaf2fa" stroke="#b6ccda" stroke-width="2"/>
<text x="80" y="240" font-size="25" font-weight="700">DISPOSITIVOS</text>
<text x="80" y="283" font-size="28">Smartphone ou computador</text>
<text x="80" y="325" font-size="28">Programas e sensores</text>
<text x="80" y="367" font-size="28">Processamento local</text>
<rect x="590" y="195" width="420" height="270" rx="10" fill="#eaf2fa" stroke="#b6ccda" stroke-width="2"/>
<text x="610" y="240" font-size="25" font-weight="700">INTERNET</text>
<text x="610" y="283" font-size="28">Interconexão de redes</text>
<text x="610" y="325" font-size="28">Protocolos de comunicação</text>
<text x="610" y="367" font-size="28">Transporte de dados</text>
<rect x="1130" y="195" width="410" height="270" rx="10" fill="#eaf2fa" stroke="#b6ccda" stroke-width="2"/>
<text x="1150" y="240" font-size="25" font-weight="700">SERVIDORES FÍSICOS</text>
<text x="1150" y="283" font-size="28">Dados e serviços remotos</text>
<text x="1150" y="325" font-size="28">Documentos e mapas</text>
<text x="1150" y="367" font-size="28">Recursos em nuvem</text>
<text x="60" y="638" font-size="25">Web é um serviço que usa a Internet. Uma aplicação online pode funcionar sem IA.</text>
<text x="60" y="676" font-size="25">Nuvem descreve a oferta e o gerenciamento de recursos. Os equipamentos continuam físicos.</text>
</g></svg>