<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1060" viewBox="0 0 1600 1060" role="img" aria-labelledby="title desc"><title id="title">Um algoritmo para inscrições</title><desc id="desc">Validar os dados e atualizar a disponibilidade evita confirmações incorretas. RECEBER: Nome e vagas disponíveis. VALIDAR: Os dados são válidos?. SE NÃO: Solicitar correção, Antes de continuar. SE SIM: Verificar se há vaga. COM VAGA: Confirmar a inscrição, Diminuir vagas em 1. SEM VAGA: Registrar na lista de espera, Manter vagas em 0</desc><defs><marker id="arrow" markerWidth="12" markerHeight="12" refX="9" refY="6" orient="auto"><path d="M0 0 L12 6 L0 12 Z" fill="#266080"/></marker></defs><rect width="100%" height="100%" fill="#ffffff"/>
<g font-family="Segoe UI,Arial,sans-serif" fill="#162a3a"><text x="60" y="70" font-size="44" font-weight="700">Um algoritmo para inscrições</text><text x="60" y="117" font-size="26">Validar os dados e atualizar a disponibilidade evita confirmações incorretas.</text>
<line x1="800" y1="267" x2="800" y2="306" stroke="#266080" stroke-width="4" marker-end="url(#arrow)"/>
<line x1="570" y1="375" x2="267" y2="479" stroke="#266080" stroke-width="4" marker-end="url(#arrow)"/>
<line x1="800" y1="438" x2="800" y2="478" stroke="#266080" stroke-width="4" marker-end="url(#arrow)"/>
<line x1="715" y1="635" x2="427" y2="715" stroke="#266080" stroke-width="4" marker-end="url(#arrow)"/>
<line x1="890" y1="635" x2="1165" y2="715" stroke="#266080" stroke-width="4" marker-end="url(#arrow)"/>
<rect x="570" y="150" width="460" height="115" rx="10" fill="#eaf2fa" stroke="#b6ccda" stroke-width="2"/>
<text x="590" y="195" font-size="25" font-weight="700">RECEBER</text>
<text x="590" y="238" font-size="28">Nome e vagas disponíveis</text>
<rect x="570" y="320" width="460" height="115" rx="10" fill="#eaf2fa" stroke="#b6ccda" stroke-width="2"/>
<text x="590" y="365" font-size="25" font-weight="700">VALIDAR</text>
<text x="590" y="408" font-size="28">Os dados são válidos?</text>
<rect x="60" y="490" width="410" height="140" rx="10" fill="#fff3df" stroke="#b6ccda" stroke-width="2"/>
<text x="80" y="535" font-size="25" font-weight="700">SE NÃO</text>
<text x="80" y="578" font-size="28">Solicitar correção</text>
<text x="80" y="620" font-size="28">Antes de continuar</text>
<rect x="570" y="490" width="460" height="140" rx="10" fill="#eaf2fa" stroke="#b6ccda" stroke-width="2"/>
<text x="590" y="535" font-size="25" font-weight="700">SE SIM</text>
<text x="590" y="578" font-size="28">Verificar se há vaga</text>
<rect x="180" y="730" width="490" height="190" rx="10" fill="#e4f3ed" stroke="#b6ccda" stroke-width="2"/>
<text x="200" y="775" font-size="25" font-weight="700">COM VAGA</text>
<text x="200" y="818" font-size="28">Confirmar a inscrição</text>
<text x="200" y="860" font-size="28">Diminuir vagas em 1</text>
<rect x="920" y="730" width="490" height="190" rx="10" fill="#fff3df" stroke="#b6ccda" stroke-width="2"/>
<text x="940" y="775" font-size="25" font-weight="700">SEM VAGA</text>
<text x="940" y="818" font-size="28">Registrar na lista de espera</text>
<text x="940" y="860" font-size="28">Manter vagas em 0</text>
<text x="60" y="978" font-size="25">Exemplo com inscrições válidas feitas uma de cada vez. Pedidos simultâneos exigem outras regras.</text>
</g></svg>